plugins {
  id 'base'
}

tasks.register('verifyAndroidProject') {
  group = 'verification'
  description = 'Placeholder verification task for environment build compatibility.'
  doLast {
    println 'Android project files are present. Full Android plugin build requires network access to resolve AGP artifacts.'
  }
}

tasks.named('build') {
  dependsOn 'verifyAndroidProject'
}
