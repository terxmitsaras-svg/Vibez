<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxalarm 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>VOXALARM <span class="version">1</span></h1>
      <div id="clock">00:00:00</div>
    </header>

    <section id="alarm-form">
      <input type="time" id="alarm-time" />
      <input type="text" id="alarm-label" placeholder="Label (optional)" maxlength="30" />
      <button id="add-alarm-btn">+ Add Alarm</button>
    </section>

    <section id="alarm-list">
      <p id="no-alarms">No alarms set.</p>
    </section>

    <!-- Active alarm overlay -->
    <div id="alarm-overlay" class="hidden">
      <div id="alarm-modal">
        <div id="alarm-ringing-label">ALARM</div>
        <div id="alarm-ringing-time"></div>
        <div id="alarm-ringing-name"></div>
        <div id="voice-hint">Say <em>"snooze"</em> or <em>"stop"</em></div>
        <div id="alarm-actions">
          <button id="snooze-btn">Snooze 5 min</button>
          <button id="dismiss-btn">Dismiss</button>
        </div>
      </div>
    </div>

    <!-- Voice recognition status -->
    <div id="voice-bar">
      <button id="voice-toggle" title="Toggle voice recognition">
        <span id="mic-icon">&#x1F399;</span>
        <span id="voice-status-text">Voice Off</span>
      </button>
      <div id="voice-transcript"></div>
    </div>
  </div>

  <audio id="alarm-audio" loop>
    <source src="alarm.mp3" type="audio/mpeg" />
  </audio>

  <script src="app.js"></script>
</body>
</html>
