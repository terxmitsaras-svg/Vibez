workflows:
  android-debug:
    name: VoxType Debug APK
    instance_type: mac_mini_m1
    max_build_duration: 30          # minutes

    environment:
      java: 17

    scripts:
      - name: Set gradlew executable
        script: chmod +x gradlew

      - name: Build debug APK
        script: ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com           # ← replace with your email
        notify:
          success: true
          failure: true
